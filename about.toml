# Keep `accepted` and `targets` identical to deny.toml.
accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "MIT",
  "Unicode-3.0",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]
ignore-dev-dependencies = true
private = { ignore = true }
