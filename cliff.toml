# git-cliff configuration: https://git-cliff.org/docs/configuration
# release.yml renders CHANGELOG.md and the release notes from this file; preview with `git cliff --bump`.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# The `<!-- N -->` prefixes on group names force Keep a Changelog's section order; `striptags` hides them.
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}

"""
footer = """
{%- macro remote_url() -%}
https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{% for release in releases -%}
{% if release.version and release.previous and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...{{ release.version }}
{% elif release.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: {{ self::remote_url() }}/releases/tag/{{ release.version }}
{% elif release.previous and release.previous.version -%}
[Unreleased]: {{ self::remote_url() }}/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor -%}
"""
trim = true
# Links are built from [remote.github]; never call the GitHub API.
offline = true

[git]
conventional_commits = true
filter_unconventional = true
# Breaking changes stay in the changelog even when their type is otherwise skipped.
protect_breaking_commits = true
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^(perf|revert)", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^(build|chore|ci|docs|refactor|style|test)", skip = true },
]
filter_commits = false
# Only final releases count; pre-release tags never become the "current version".
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"

[remote.github]
owner = "The-Mod-Elephant"
repo = "weidu-rebuild"

[bump]
# In 0.y.z, breaking changes bump the minor version; leaving 0.x is an explicit decision.
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "v0.1.0"
