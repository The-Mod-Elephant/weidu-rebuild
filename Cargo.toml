[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
# Opting in requires `#[allow(unsafe_code)]` and a `// SAFETY:` comment (CLAUDE.md).
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
