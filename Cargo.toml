[package]
name = "iemod"
version = "0.0.1"
authors = [ "dark0dave", "4Luke4" ]
edition = "2024"
license = "GPL-3.0-or-later"
readme = "README.md"
description = "Weidu Rebuild"
homepage = "https://github.com/The-Mod-Elephant/weidu-rebuild"
categories = [ "command-line-interface", "filesystem" ]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
