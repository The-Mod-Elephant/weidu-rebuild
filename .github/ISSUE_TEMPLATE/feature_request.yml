name: Feature request
description: Suggest a new capability or an improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to achieve, and what makes it hard today? Describe the need before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work, ideally with an example command or mod snippet.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Command-line interface
        - Filesystem sandbox
        - File formats
        - Mod language
        - Build, CI or release tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Could this let a mod read, write or execute anything outside the game directory? See docs/architecture/THREAT_MODEL.md.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and this has not been requested yet.
          required: true
