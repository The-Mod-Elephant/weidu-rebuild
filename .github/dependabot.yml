version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Gives the ecosystem time to catch a compromised or broken release before it lands here.
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
  # flake.lock pins every tool in the Nix shell, including those used by CI.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
