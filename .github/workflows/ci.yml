name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # check out the repository
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        name: Classify changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Unknown base (new branch, manual run): run everything.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! files=$(git diff --name-only "$BASE...$GITHUB_SHA"); then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '^(crates/|Cargo\.(toml|lock)$|rust-toolchain\.toml$|deny\.toml$|\.github/workflows/ci\.yml$)' <<<"$files"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi
  rust:
    name: Rust tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: false
      matrix:
        # Linting runs in lint.yml (hk); this job tests on each OS. Windows runs on every pull request
        # because path handling differs most there.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Pull requests restore main's cache instead of each writing their own.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        run: cargo test --workspace --locked
      - name: cargo doc
        if: runner.os == 'Linux'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked
  gate:
    name: CI gate
    if: always()
    needs: [changes, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Evaluate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # Skipped jobs are fine; anything else that did not succeed fails the gate.
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          for job in $failed; do
            echo "::error title=CI gate::job ${job%%=*} finished with result ${job#*=}"
          done
          [ -z "$failed" ]
