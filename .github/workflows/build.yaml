name: build
on:
  push:
    branches:
      - main
    # Without a tags filter, a tag push does not start this workflow (GitHub workflow syntax,
    # on.push.<branches|tags>), and trigger-release below could never run.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ''
            pre: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ''
            pre: ''
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            suffix: ''
            pre: 'sudo apt-get install -yqqq musl-tools'
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ''
            pre: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ''
            pre: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: .exe
            pre: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache
        # Release (tag) builds skip the cache (THREAT_MODEL T11). zizmor does not evaluate
        # this condition, so its cache-poisoning finding is ignored here.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        # src/version.rs reads IEMOD_RELEASE_VERSION at compile time (ADR 0002).
        run: echo "IEMOD_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: build
        run: |
          ${{ matrix.pre }}
          rustup target add ${{ matrix.target }}
          cargo test --workspace --target ${{ matrix.target }}
          cargo build --target ${{ matrix.target }} --release --workspace
      - name: Version smoke test
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          expected="iemod ${IEMOD_RELEASE_VERSION:-0.0.0-dev}"
          actual=$("./target/${TARGET}/release/iemod${SUFFIX}" --version)
          if [ "$actual" != "$expected" ]; then
            echo "::error title=Wrong version in the ${TARGET} binary::'--version' printed '${actual}', expected '${expected}'"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iemod-${{ matrix.target }}${{ matrix.suffix }}
          path: ./target/${{ matrix.target }}/release/iemod${{ matrix.suffix }}
          if-no-files-found: error
  build-nix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: nixcache
        # As for the Cargo cache above.
        if: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          save: ${{ github.ref == 'refs/heads/main' }}
      - name: build
        env:
          RUSTFLAGS: -D warnings
        run: nix build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iemod-nix
          path: ./result/bin/iemod
          if-no-files-found: error
  trigger-release:
    needs: [build, build-nix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, so that gh can resolve the repository
      actions: write # gh workflow run calls POST .../actions/workflows/{id}/dispatches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trigger
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if ! out=$(gh workflow run release.yaml --ref "$REF_NAME" -f run_id="$RUN_ID" 2>&1); then
            echo "::error title=Could not start release.yaml::${out//$'\n'/ }"
            exit 1
          fi
