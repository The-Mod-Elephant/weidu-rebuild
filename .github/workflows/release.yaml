name: release
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: iemod-x86_64-apple-darwin
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: iemod-aarch64-apple-darwin
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: iemod-x86_64-unknown-linux-musl
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: iemod-x86_64-unknown-linux-gnu
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: iemod-aarch64-unknown-linux-gnu
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
        with:
          name: iemod-x86_64-pc-windows-msvc.exe
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            iemod-x86_64-apple-darwin \
            iemod-aarch64-apple-darwin \
            iemod-x86_64-unknown-linux-musl \
            iemod-x86_64-unknown-linux-gnu \
            iemod-aarch64-unknown-linux-gnu \
            iemod-x86_64-pc-windows-msvc.exe \
            --generate-notes
