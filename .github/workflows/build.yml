# Release builds, called by release.yml; the caller provides the version and the changelog artifact.
name: Build
on:
  workflow_call:
    inputs:
      version:
        description: Version to embed and smoke-test, without the leading v (e.g. 0.1.0)
        type: string
        required: true
      tag:
        description: Release tag used in archive names (e.g. v0.1.0)
        type: string
        required: true
      changelog-artifact:
        description: Name of the artifact, uploaded earlier in the calling run, that holds CHANGELOG.md
        type: string
        required: true
permissions: {}
env:
  CARGO_TERM_COLOR: always
jobs:
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: nixcache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - name: Generate THIRD_PARTY_NOTICES.md
        shell: 'nix develop -c bash -e {0}'
        run: cargo about generate --locked about.hbs --output-file THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7
  build:
    name: Build ${{ matrix.target }}
    needs: notices
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: true
      matrix:
        # Native runners only, so every binary can be smoke-tested before publishing.
        include:
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-latest}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm}
          - {target: x86_64-pc-windows-msvc, os: windows-latest}
          - {target: aarch64-apple-darwin, os: macos-latest}
          - {target: x86_64-apple-darwin, os: macos-15-intel}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      PACKAGE: iemod-${{ inputs.tag }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false # release artifacts are never built from a restored cache
      - name: cargo build --release
        shell: bash
        env:
          IEMOD_RELEASE_VERSION: ${{ inputs.version }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --release --locked --package iemod-cli --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.changelog-artifact }}
      - name: Smoke test and stage
        shell: bash
        run: |
          exe="target/$TARGET/release/iemod"
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          actual=$("$exe" --version)
          if [ "$actual" != "iemod $VERSION" ]; then
            echo "::error title=Smoke test failed::'$exe --version' printed '$actual', expected 'iemod $VERSION'"
            exit 1
          fi
          mkdir -p "dist/$PACKAGE"
          cp "$exe" LICENSE README.md CHANGELOG.md THIRD_PARTY_NOTICES.md "dist/$PACKAGE/"
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: Compress-Archive -Path $env:PACKAGE -DestinationPath "$env:PACKAGE.zip"
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        working-directory: dist
        run: tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.*
          if-no-files-found: error
          retention-days: 7
