# Labels inactive issues and pull requests, then closes them if nothing happens. Anything with an
# exempt label, an assignee or a milestone is never touched, and any activity removes the label.
name: Stale issues and pull requests
on:
  schedule:
    - cron: "35 20 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  # A manual run while the scheduled one is active would only race on the same items.
  group: stale
  cancel-in-progress: false
jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write # label, comment on and close stale issues
      pull-requests: write # label, comment on and close stale pull requests
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: security,pinned,help wanted,good first issue
          exempt-pr-labels: security,pinned,dependencies
          exempt-all-assignees: true
          exempt-all-milestones: true
          exempt-draft-pr: true
          stale-issue-message: >-
            This issue has had no activity for 60 days, so it has been marked as stale. It will be closed in 14 days unless someone comments or removes the `stale` label. If it is still relevant, please add any new information that would help move it forward.
          stale-pr-message: >-
            This pull request has had no activity for 60 days, so it has been marked as stale. It will be closed in 14 days unless it is updated or the `stale` label is removed.
          close-issue-message: >-
            Closed after 14 more days without activity. Comment if this should be reopened.
          close-pr-message: >-
            Closed after 14 more days without activity. Feel free to reopen it when work resumes.
