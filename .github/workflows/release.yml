# Releases are published only by this workflow (CLAUDE.md). Run it on main; see CONTRIBUTING.md.
name: Release
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify everything, but do not create the tag or the release
        type: boolean
        default: true
      bump:
        description: "auto follows the commits; major leaves 0.x for 1.0.0"
        type: choice
        options: [auto, major]
        default: auto
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  plan:
    name: Plan and verify the release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # read history and tags
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs every commit and tag
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: nixcache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - id: verify
        name: Compute the version and generate the changelog
        shell: 'nix develop -c bash -e {0}'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          bump=(--bump)
          if [ "$BUMP" != auto ]; then bump=(--bump "$BUMP"); fi
          tag=$(git cliff "${bump[@]}" --bumped-version)
          # git-cliff prints the current version when nothing since the last tag bumps it.
          if git rev-parse --quiet --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error title=Nothing to release::${tag} already exists and no commit since requires a release"
            exit 1
          fi
          git cliff "${bump[@]}" -o CHANGELOG.md
          git cliff "${bump[@]}" --unreleased --strip all > release-notes.md
          echo "::notice title=Release plan::${tag} at ${GITHUB_SHA}"
          { echo "tag=${tag}"; echo "version=${tag#v}"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog
          path: |
            CHANGELOG.md
            release-notes.md
          if-no-files-found: error
          retention-days: 7
  notices:
    name: Third-party notices
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      - name: nixcache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      - name: Generate THIRD_PARTY_NOTICES.md
        shell: 'nix develop -c bash -e {0}'
        run: cargo about generate --locked about.hbs --output-file THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 7
  build:
    name: Build ${{ matrix.target }}
    needs: [plan, notices]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
    strategy:
      fail-fast: true
      matrix:
        # Native runners only, so every binary can be smoke-tested before publishing.
        include:
          - {target: x86_64-unknown-linux-gnu, os: ubuntu-latest}
          - {target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm}
          - {target: x86_64-pc-windows-msvc, os: windows-latest}
          - {target: aarch64-apple-darwin, os: macos-latest}
          - {target: x86_64-apple-darwin, os: macos-15-intel}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.plan.outputs.version }}
      PACKAGE: iemod-${{ needs.plan.outputs.tag }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false # release artifacts are never built from a restored cache
      - name: cargo build --release
        shell: bash
        env:
          IEMOD_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --release --locked --package iemod-cli --target "$TARGET"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog
      - name: Smoke test and stage
        shell: bash
        run: |
          exe="target/$TARGET/release/iemod"
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          actual=$("$exe" --version)
          if [ "$actual" != "iemod $VERSION" ]; then
            echo "::error title=Smoke test failed::'$exe --version' printed '$actual', expected 'iemod $VERSION'"
            exit 1
          fi
          mkdir -p "dist/$PACKAGE"
          cp "$exe" LICENSE README.md CHANGELOG.md THIRD_PARTY_NOTICES.md "dist/$PACKAGE/"
      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: dist
        run: Compress-Archive -Path $env:PACKAGE -DestinationPath "$env:PACKAGE.zip"
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        working-directory: dist
        run: tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.*
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish ${{ needs.plan.outputs.tag }}
    needs: [plan, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # create the tag and the GitHub Release
      id-token: write # OIDC token for the Sigstore signing certificate
      attestations: write # store the provenance attestations
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the tag and GitHub Release
        run: |
          # `gh release create` would silently reuse a tag created since planning.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error title=Tag already exists::${TAG} was created after planning; nothing was published"
            exit 1
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes-file release-notes.md
